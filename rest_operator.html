<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rest Operator</title>
</head>
<body>
    <script>
        function sum(num1,num2)
        {
            document.write(num1+num2 + "<br>");
        }
        sum(10,20);
        sum(10,25,30);
    </script>
    <script>
        /*syntax
        function add(..........numbers)

        */

        function add(...numbers){
            let sum=0;
            for(let i in numbers){
                sum += numbers[i];
            }
            document.write(sum + "<br>");
        }
        add(10,25,56,45); 
        add(12,12,12);

        //HW  rest operator ,spread operator ,destructuring ;
        
          
    </script>
    
</body>
</html>
