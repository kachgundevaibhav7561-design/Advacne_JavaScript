<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h2>Ajax Using fetch load the json file</h2>

    <button onclick="loadJSON()">Load Json File </button>
    <div id="output"></div>
    <script>

        function loadJSON() {
            fetch("data.json")
                .then(response => {
                    document.getElementById("output").innerHTML =
                        "HTTP status code: " + response.status + "<br>";

                    if (!response.ok) {
                        throw new Error("File not found");
                    }

                    return response.json();
                })
                .then(data => {
                    document.getElementById("output").innerHTML = `
                <h3>JSON Loaded Successfully</h3>
                <b>Name:</b> ${data.name}<br>
                <b>Age:</b> ${data.age}<br>
                <b>City:</b> ${data.city}<br>
              <b>Skill:</b> ${data.Skill.join(", ")}
            `;
                })
                .catch(error => {
                    document.getElementById("output").innerHTML =
                        `<p>${error.message}</p>`;
                });
        }
    </script>

</body>

</html>
