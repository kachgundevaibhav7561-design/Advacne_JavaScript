<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <!--
        promise means :  i am doing some work  now. i will giver you the result later. if the works   is  done succesfully then i will givr you the result otherwise i will give you the error .
        for example 
        - call an api
        - fetching data from server
        -reading a file 
        -database operation
        -waiting for timer
        
        Total 3 state of promises
        1. pending : inttil stage ,before the promise succesds or fails
        2. Fulfilled : the operation completed successfully.
        3. Rejected : the operation failed  
        
        
        create a promise 
        syntax :
        let promise = new Promise(function(resolve,reject)
        {
            //statement...
        });
        
 -->

    <script>
        let promise = new Promise(function (resolve, reject) {
            let success = true;
            if (success) {
                resolve("operation Successfully");
            }
            else {
                reject("operation failed");
            }
        });
    </script>

    <script>
        function login(username, password) {
            return new Promise(function (resolve, reject) {
                if (username === "admin" && password === "1234") {
                    resolve("Login successfully");
                } else {
                    reject("Invalid Credentils");
                }

            });
        }
        login("admin", "1234")
            .then(function (result) {
                console.log(result);
            })
            .catch(function (error) {
                console.log(error);
            });

    </script>
    <script>
        // Create a Promise using user input - prompt()

        let promise2 = new Promise(function (resolve2, reject2) {

            let username = prompt("Enter a username");
            let password = prompt("Enter a password");

            if (username === "admin" && password === "1234") {
                resolve2("Login successfully");
            } else {
                reject2("Invalid Credentials");
            }
        });

        promise2
            .then(msg => {
                document.write("<h2 style='color:green'>" + msg + "</h2>");
            })
            .catch(err => {
                document.write("<h2 style='color:red'>" + err + "</h2>");
            })
            .finally(() => {
                document.write("<p style='color:blue'>Login attempt complete</p>");
            });
    </script>

    <script>
        let promise3 = new Promise((resolve, reject) => {
            console.log("fetching data..");

            setTimeout(() => {
                let dataAvailable = true;
                if (dataAvailable) {
                    resolve("Data received from server... succesfuly");
                }
                else {
                    reject("Server error : Something went wrong");
                }
            })
        })
        promise3
            .then(res => console.log(res))
            .catch(err => console.log(err))
            .finally(() => console.log("request process completd.."));
    </script>
</body>

</html>
