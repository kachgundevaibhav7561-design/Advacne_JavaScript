
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch Comments using Async Await</title>
</head>

<body>

    <h2>Fetch Data Using Async Await</h2>

    <button onclick="loadComments()">Click to Load</button>

    <pre id="output"></pre>

    <script>
        async function loadComments() {
            try {
                document.getElementById("output").textContent =
                    "Loading comments...";

                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/comments"
                );

                if (!response.ok) {
                    throw new Error("Failed to fetch comments!");
                }

                const data = await response.json();

                let result = "Data loaded successfully!\n\n";

                data.forEach((comments) => {
                    result +=
                        `ID: ${comments.id}\n` +
                        `Name: ${comments.name}\n` +
                        `Email: ${comments.email}\n\n`;
                });

                document.getElementById("output").textContent = result;

            } catch (error) {
                document.getElementById("output").textContent =
                    "Error: " + error.message;
            }
        }
    </script>

</body>
</html>
