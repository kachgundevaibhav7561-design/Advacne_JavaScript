<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>

        //its global scope
        var a = "Hello its sagar";
        var a = "Hello its vaibhav";//redeclare is allowed
        a = "Vaibhav";//re-assign allowed
        console.log(a);

        //functional scope and block scope
        let b = "Hello sunil";
        // let b="Hello karan" //redeclare is not allowed
        b = "Hello Pooja"; // reassign is allowed
        console.log(b);

        // const c="Techonlogy";
        // const c="Computer System";// redeclare is not allowed 
        c = "cs";  // reassign is not allowed
        console.log(c);


        //using if condition 
        if (10 == 10) {
            var y="Hello neha";//global scope
            let x="Hello Pooja"//block scope
            const z="Hello nikhil";
            console.log(x);
            console.log(z);

        }
        console.log(y);
    </script>

    <script>
        function example()
        {
            var p=1; //global scope
            let q= 2; //block scope
            const r=3; //block scope

            if (true) {//inside this block
                var p=10;
                let q=20;
                const r=30;

                //inside the block 
                document.write("-------Inside the block---------<br>")
                document.write("p ="+p+ "<br>");
                document.write("q ="+q+ "<br>");
                document.write("r ="+r+ "<br> <br>");    
            }

             //outside the block 
                document.write("-------Outside the block---------<br>")
                document.write("p ="+p+ "<br>");
                document.write("q ="+q+ "<br>");
                document.write("r ="+r+ "<br> <br>");   

        }
        //call function 
        example();

        let name = "yogesh";
        console.log(typeof name);
    </script>
</body>
</html>
